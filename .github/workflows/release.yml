name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Validate tag and project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/CmdletForge/CmdletForge.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $tag = '${{ github.ref_name }}'
          if ('v' + $version -ne $tag) {
            throw "Tag ${{ github.ref_name }} komt niet overeen met projectversie $version."
          }
          $releaseBranch = if ($tag -match '^v\d+\.\d+\.\d+-beta\.\d+$') {
            'origin/beta'
          } elseif ($tag -match '^v\d+\.\d+\.\d+$') {
            'origin/main'
          } else {
            throw "Alleen stabiele tags vX.Y.Z en betatags vX.Y.Z-beta.N zijn toegestaan."
          }
          $branchHead = git rev-parse $releaseBranch
          if ($branchHead -ne '${{ github.sha }}') {
            throw "Tag $tag moet exact op de HEAD van $releaseBranch staan."
          }
      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore CmdletForge.slnx
          dotnet build CmdletForge.slnx --configuration Release --no-restore -p:UpdateRepository=${{ github.repository }}
          dotnet run --project tests/CmdletForge.Tests/CmdletForge.Tests.csproj --configuration Release --no-build
      - name: Publish and hash
        shell: pwsh
        run: ./scripts/package.ps1 -UpdateRepository '${{ github.repository }}'
      - name: Attest executable
        uses: actions/attest@v4
        with:
          subject-path: artifacts/publish/CmdletForge-win-x64.exe
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}',
            '--verify-tag', '--generate-notes',
            'artifacts/publish/CmdletForge-win-x64.exe',
            'artifacts/publish/CmdletForge-win-x64.exe.sha256'
          )
          if ('${{ github.ref_name }}' -match '-beta\.\d+$') {
            $arguments += '--prerelease'
          }
          gh @arguments
